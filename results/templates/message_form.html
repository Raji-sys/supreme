<!-- templates/letter/message_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 12px;
            line-height: 1.5;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 768px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #e63946;
            font-size: 18px;
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            font-size: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn-cancel {
            background-color: #6c757d;
        }
        .btn-cancel:hover {
            background-color: #5a6268;
        }
        .actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            <label for="id_recipient_name">Recipient</label>
            {{ form.recipient_name }}

            <label for="id_recipient_address">Recipient Address</label>
            {{ form.recipient_address }}

            <label for="id_subject">Subject</label>
            {{ form.subject }}

            <label for="id_content">Message</label>
            {{ form.content }}

            <div class="actions">
                <button type="submit" class="btn">Save</button>
                <a href="{% url 'message_list' %}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
