{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="p-4">
  <div class="max-w-xl text-center mx-auto bg-white rounded-xl p-8 shadow-2xl shadow-black">
    <h1 class="text-sm uppercase font-bold mb-6">GENERAL TEST FORM</h1>
    <form method="post" class="space-y-6 text-xs">
      {% csrf_token %}
      <div class="mb-2 uppercase text-cyan-900 px-4 md:px-10">
        <div class="grid grid-cols-5 gap-4">
        {% for field in form %}
        <div class="grid grid-cols-6">
        <div class="flex flex-wrap justify-center">
          <label for="{{field.id_for_label}}" class="block">{{ field.label_tag }}</label>
        </div>
        <div class="grid grid-cols-6 mb-2 normal-case">
          {{ field }}
        </div>
      </div>
      {%endfor%}
    </div>
      </div>

      <button type="submit" class="text-xs uppercase bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
      save
      </button>
    </form>

  </div>
</div>
{% endblock %}
